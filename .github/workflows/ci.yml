name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Run the tests with coverage
        run: |
          python -m coverage run -m pytest
          python -m coverage report

  dashboard:
    name: Dashboard assets and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Syntax-check the dashboard scripts
        run: |
          node --check src/gitstory/assets/app.js
          node --check src/gitstory/assets/aurora.js
          node --check src/gitstory/assets/aurora-charts.js
      - name: Static checks of the dashboard, the report renderer and the card
        run: python -m pytest tests/test_dashboard_assets.py tests/test_render_html.py tests/test_render_svg_card.py -q
      - name: The examples still regenerate
        run: |
          python examples/generate.py --out "$RUNNER_TEMP/examples"
          test -s "$RUNNER_TEMP/examples/report.html"
          python -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" "$RUNNER_TEMP/examples/metrics.json"

  package:
    name: Build and install the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - name: Install the wheel in a clean environment and run it
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/clean/bin/gitstory" --version
          "$RUNNER_TEMP/clean/bin/gitstory" report . -o "$RUNNER_TEMP/report.html"
          "$RUNNER_TEMP/clean/bin/gitstory" card . -o "$RUNNER_TEMP/card.svg"
          test -s "$RUNNER_TEMP/report.html"
          test -s "$RUNNER_TEMP/card.svg"
