  /* visually hidden, not removed: the pill keeps its accessible name */
  .a-pill__label { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
}
/* narrow screens: the rail becomes a bar at the bottom, the bars scroll sideways */
@media (max-width: 760px) {
  :root { --a-bar-pad: 12px; }
  .a-shell { display: block; }
  .a-rail { position: fixed; inset: auto 0 0 0; z-index: 50; flex-direction: row; justify-content: center; gap: 4px; width: auto; height: calc(56px + env(safe-area-inset-bottom, 0px)); padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px)); border-right: 0; border-top: 1px solid var(--line); background: color-mix(in oklab, var(--bg-0) 92%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  .a-rail__logo, .a-rail__spacer { display: none; }
  .a-rail__group { flex-direction: row; gap: 4px; }
  .a-rail__group + .a-rail__group { margin: 0 0 0 8px; }
  .a-rail__group + .a-rail__group::before { top: 9px; left: -6px; width: 1px; height: 22px; }
  .a-rail__item::after { display: none; }
  .a-frame { min-height: 100dvh; padding-bottom: calc(56px + env(safe-area-inset-bottom, 0px)); }
  .a-statusbar { display: none; }
  .a-nav { display: none; }
  .a-search { width: 34px; padding: 0; justify-content: center; }
  .a-search span { display: none; }
  .a-topbar { gap: 8px; }
  .a-subbar { gap: 8px; overflow-x: auto; scrollbar-width: none; }
  .a-subbar::-webkit-scrollbar { display: none; }
  .a-subbar__tabs { overflow-x: auto; scrollbar-width: none; }
  .a-main { padding-bottom: 28px; }
}

/* ───────────────────────────── typography ───────────────────────────── */
.a-h1 { font-size: clamp(24px, 3vw, 30px); line-height: 1.15; letter-spacing: -0.02em; font-weight: 600; }
.a-h2 { font-size: clamp(18px, 2vw, 21px); line-height: 1.25; letter-spacing: -0.015em; font-weight: 600; }
.a-h3 { font-size: 15px; line-height: 1.3; letter-spacing: -0.005em; font-weight: 600; }
.a-eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.a-muted { color: var(--ink-2); }
.a-faint { color: var(--ink-3); }
.a-mono { font-family: var(--font-mono); font-size: 0.92em; }
.a-num { font-variant-numeric: tabular-nums; }
.a-hero-figure { font-size: clamp(48px, 7vw, 72px); line-height: 1; font-weight: 600; letter-spacing: -0.035em; color: var(--ink-1); }
.a-gradient-text { background: linear-gradient(110deg, var(--ink-1) 30%, var(--accent) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
.a-divider { height: 1px; background: var(--line); border: 0; margin: 0; }
.a-pagehead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; margin-bottom: 18px; }
.a-pagehead > :first-child { min-width: 0; flex: 1 1 16rem; }
.a-pagehead__sub { margin-top: 6px; color: var(--ink-2); font-size: 13px; }
.a-pagehead__actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

/* the home screen vocabulary: greeting, headline, lede */
.a-hero { display: flex; flex-direction: column; align-items: center; padding: 28px 8px 26px; text-align: center; }
.a-greet { margin: 0 0 6px; color: var(--ink-2); font-size: 14px; line-height: 20px; }
.a-headline { margin: 0; color: var(--ink-1); font: 600 clamp(24px, 4.2vw, 34px)/1.08 var(--font-sans); letter-spacing: -0.02em; text-transform: uppercase; overflow-wrap: anywhere; }
.a-lede { max-width: 520px; margin: 12px 0 0; color: var(--ink-2); font-size: 14px; line-height: 21px; }
.a-lede strong { color: var(--ink-1); font-weight: 500; }
.a-hero .a-row { justify-content: center; margin-top: 18px; }

/* ───────────────────────────── card ───────────────────────────── */
.a-card {
  position: relative;
  border-radius: var(--radius);
  background: color-mix(in oklab, var(--ink-1) 2.5%, var(--bg-0));
  border: 1px solid var(--line);
}
.a-card__head { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px 12px; padding: 14px 16px 0; }
.a-card__head > :first-child { flex: 1 1 12rem; min-width: 0; }
.a-card__title { font-size: 13.5px; font-weight: 600; letter-spacing: -0.005em; color: var(--ink-1); }
.a-card__sub { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.a-card__actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.a-card__body { padding: 14px 16px 16px; }
.a-card__foot { padding: 10px 16px; border-top: 1px solid var(--line); background: color-mix(in oklab, var(--ink-1) 4.5%, transparent); border-radius: 0 0 calc(var(--radius) - 1px) calc(var(--radius) - 1px); color: var(--ink-3); font-size: 12px; }
.a-card--flush .a-card__body { padding: 0; }
.a-card--flush .a-card__head { padding-bottom: 12px; }
.a-card--link { display: flex; flex-direction: column; padding: 0; overflow: hidden; color: var(--ink-1); text-align: left; text-decoration: none; cursor: pointer; transition: transform var(--dur-1) var(--ease-out), border-color var(--dur-1); }
.a-card--link:hover { border-color: var(--line-strong); transform: translateY(-1px); }
.a-refreshing { opacity: 0.6; transition: opacity var(--dur-2); pointer-events: none; }

/* link cards with a colour tile (the starters of the home screen) */
.a-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 980px) { .a-cards { grid-template-columns: 1fr; } }
.a-linkcard__top { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
.a-tile { --tile: var(--tile-blue); display: grid; place-items: center; flex: none; width: 30px; height: 30px; border-radius: 9px; background: var(--tile); color: #fff; }
.a-tile--blue { --tile: var(--tile-blue); } .a-tile--violet { --tile: var(--tile-violet); } .a-tile--red { --tile: var(--tile-red); }
.a-tile--green { --tile: var(--tile-green); } .a-tile--amber { --tile: var(--tile-amber); }
.a-linkcard__title { min-width: 0; font-size: 13px; font-weight: 500; line-height: 1.25; }
.a-linkcard__foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 14px; background: color-mix(in oklab, var(--ink-1) 4.5%, transparent); color: var(--ink-2); font-size: 11.5px; }

/* recent items on a timeline */
.a-recents__title { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; color: color-mix(in oklab, var(--ink-1) 85%, transparent); font-size: 13px; font-weight: 500; }
.a-recents__list { position: relative; margin: 0; padding: 0 0 0 7px; list-style: none; }
.a-recents__list::before { content: ""; position: absolute; left: 6px; top: 0; bottom: 6px; width: 1px; background: var(--line); }
.a-recent { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; padding: 7px 0 7px 18px; border: 0; background: transparent; color: var(--ink-2); font: 12.5px/1.4 var(--font-sans); text-align: left; text-decoration: none; cursor: pointer; transition: color var(--dur-1); }
.a-recent::before { content: ""; position: absolute; left: -1px; top: 50%; width: 10px; height: 1px; background: var(--line); }
.a-recent:hover { color: var(--ink-1); }
.a-recent__title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.a-recent time, .a-recent__meta { flex: none; font-size: 11px; opacity: 0.85; }

/* ───────────────────────────── controls ───────────────────────────── */
.a-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 34px; padding: 0 13px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--fill); color: var(--ink-1);
  font: 500 13px/1 var(--font-sans); white-space: nowrap; text-decoration: none; cursor: pointer;
  transition: background-color var(--dur-1), border-color var(--dur-1), color var(--dur-1), transform var(--dur-1) var(--ease-out);
}
.a-btn:hover { background: var(--fill-strong); border-color: var(--line-strong); }
.a-btn:active { transform: translateY(1px); }
.a-btn--primary { border-color: transparent; color: #fff; background: var(--accent-solid); }
.a-btn--primary:hover { border-color: transparent; background: var(--accent-solid-hover); }
.a-btn--tint { border-color: var(--accent-line); background: var(--accent-soft); color: var(--ink-1); }
.a-btn--tint:hover { border-color: var(--accent-line); background: color-mix(in oklab, var(--accent) 24%, transparent); }
.a-btn--soft { border-color: transparent; }
.a-btn--ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.a-btn--ghost:hover { color: var(--ink-1); background: var(--fill-strong); border-color: transparent; }
.a-btn--danger { border-color: color-mix(in oklab, var(--critical) 50%, transparent); background: color-mix(in oklab, var(--critical) 14%, transparent); color: var(--ink-1); }
.a-btn--danger:hover { border-color: color-mix(in oklab, var(--critical) 70%, transparent); background: color-mix(in oklab, var(--critical) 26%, transparent); }
.a-btn--sm { height: 30px; padding: 0 11px; font-size: 12px; border-radius: 9px; }
.a-btn--icon { width: 34px; padding: 0; }
.a-btn--icon.a-btn--sm { width: 30px; }
.a-btn--primary .a-kbd, .a-btn--danger .a-kbd { color: rgba(255, 255, 255, 0.92); background: rgba(255, 255, 255, 0.16); }
.a-btn[disabled], .a-btn[aria-disabled="true"] { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
.a-input, .a-select {
  width: 100%; height: 36px; padding: 0 12px; border-radius: 10px;
  background: color-mix(in oklab, var(--ink-1) 4%, var(--bg-0)); border: 1px solid var(--line); color: var(--ink-1);
  font: 400 13.5px var(--font-sans); transition: border-color var(--dur-1), box-shadow var(--dur-1), background-color var(--dur-1);
}
.a-input::placeholder { color: var(--ink-3); }
.a-input:hover, .a-select:hover { border-color: var(--line-strong); }
.a-input:focus-visible, .a-select:focus-visible { outline: none; border-color: var(--accent-line); box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 22%, transparent); }
.a-input[aria-invalid="true"] { border-color: var(--critical); }
textarea.a-input { height: auto; min-height: 84px; padding: 10px 12px; line-height: 1.5; resize: vertical; }
.a-select { appearance: none; -webkit-appearance: none; padding-right: 32px; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
.a-select option { background: var(--surface-2); color: var(--ink-1); }
.a-field { display: grid; gap: 6px; }
.a-field > label, .a-label { font: 500 12px var(--font-sans); color: var(--ink-2); }
.a-field__hint { font-size: 12px; color: var(--ink-3); }
.a-field__error { font-size: 12px; color: var(--delta-bad); }
.a-switch { position: relative; flex: none; width: 38px; height: 22px; appearance: none; -webkit-appearance: none; border-radius: 999px; background: var(--fill-strong); border: 1px solid var(--line); cursor: pointer; transition: background-color var(--dur-2) var(--ease-out); }
.a-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--ink-1); transition: transform var(--dur-2) var(--ease-out), background-color var(--dur-2); }
.a-switch:checked { background: var(--accent-solid); border-color: transparent; }
.a-switch:checked::after { transform: translateX(16px); background: #fff; }
.a-kbd { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: 6px; background: var(--fill); font: 500 11px var(--font-sans); color: var(--ink-2); }
.a-chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--fill); color: var(--ink-2); font: 500 12px var(--font-sans); cursor: pointer; transition: color var(--dur-1), background-color var(--dur-1), border-color var(--dur-1); }
.a-chip:hover { color: var(--ink-1); background: var(--fill-strong); }
.a-chip[aria-pressed="true"] { color: var(--ink-1); background: var(--accent-soft); border-color: var(--accent-line); }
.a-chip__n { font: 600 11px var(--font-mono); color: var(--ink-3); }

/* the composer: a rounded card with a blue-to-ember hairline (the primary input of a screen) */
.a-composer, .a-dropzone { position: relative; border-radius: 18px; background: color-mix(in oklab, var(--ink-1) 4%, var(--bg-0)); }
.a-composer::before, .a-dropzone::before {
  content: ""; position: absolute; inset: 0; padding: 1px; border-radius: inherit; pointer-events: none; opacity: 0.5; transition: opacity 200ms;
  background: linear-gradient(110deg, rgb(88 112 255 / 0.75), rgb(168 90 160 / 0.5) 50%, rgb(240 92 40 / 0.8));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
}
.a-composer:focus-within::before, .a-composer--lit::before, .a-dropzone:hover::before, .a-dropzone.is-over::before, .a-dropzone:focus-visible::before { opacity: 1; }
.a-composer { display: grid; gap: 8px; padding: 12px 14px; }
.a-composer__input { width: 100%; min-height: 26px; padding: 0; border: 0; outline: none; background: transparent; color: var(--ink-1); font: 400 14px/1.5 var(--font-sans); resize: none; }
.a-composer__input::placeholder { color: var(--ink-3); }
.a-composer__bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

/* ───────────────────────────── badges (status = icon + label) ───────────────────────────── */
.a-badge { --_c: var(--ink-3); display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px 0 7px; border-radius: 999px; font: 500 12px/1 var(--font-sans); white-space: nowrap; color: var(--ink-1); background: color-mix(in oklab, var(--_c) 14%, transparent); border: 1px solid color-mix(in oklab, var(--_c) 38%, transparent); }
.a-badge svg { flex: none; color: var(--_c); }
.a-stack > :is(.a-badge, .a-chip, .a-live), .a-dialog__body > :is(.a-badge, .a-chip, .a-live) { align-self: flex-start; justify-self: start; }
.a-badge--good { --_c: var(--good); } .a-badge--warn { --_c: var(--warn); } .a-badge--serious { --_c: var(--serious); }
.a-badge--critical { --_c: var(--critical); } .a-badge--info { --_c: var(--accent); } .a-badge--neutral { --_c: var(--ink-3); }

/* ───────────────────────────── stat tile ───────────────────────────── */
.a-stat { display: flex; flex-direction: column; gap: 6px; padding: 16px 16px 14px; min-height: 120px; }
.a-stat__label { font: 500 12px var(--font-sans); color: var(--ink-2); }
.a-stat__value { font: 600 clamp(26px, 2.8vw, 32px)/1.05 var(--font-sans); letter-spacing: -0.025em; color: var(--ink-1); }
.a-stat--hero .a-stat__value { font-size: clamp(48px, 6.4vw, 68px); letter-spacing: -0.035em; line-height: 1; }
.a-stat__hint { font-size: 12px; color: var(--ink-3); }
.a-stat__row { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 12px; margin-top: auto; padding-top: 6px; }
.a-stat__spark { margin-left: auto; max-width: 100%; }
.a-delta { display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: 0 6px; max-width: 100%; font: 600 12px var(--font-sans); }
.a-delta__v { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.a-delta small { font-weight: 400; font-size: 12px; color: var(--ink-3); }
.a-delta--good { color: var(--delta-good); } .a-delta--bad { color: var(--delta-bad); } .a-delta--flat { color: var(--ink-3); }

/* ───────────────────────────── meter + segmented bar ───────────────────────────── */
.a-meter { --_fill: var(--accent); display: grid; gap: 6px; }
.a-meter[data-kind="warn"] { --_fill: var(--warn); } .a-meter[data-kind="serious"] { --_fill: var(--serious); } .a-meter[data-kind="critical"] { --_fill: var(--critical); }
.a-meter__head { display: flex; justify-content: space-between; font: 500 12px var(--font-sans); color: var(--ink-2); }
.a-meter__bar { position: relative; height: 6px; border-radius: 999px; overflow: hidden; background: color-mix(in oklab, var(--_fill) 20%, transparent); }
.a-meter--thin .a-meter__bar { height: 4px; }
.a-meter__bar > i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: inherit; background: var(--_fill); transition: width var(--dur-3) var(--ease-out), background-color var(--dur-2); }
.a-segbar { display: grid; gap: 10px; }
.a-segbar__bar { display: flex; gap: 2px; height: 8px; }
.a-segbar--tall .a-segbar__bar { height: 28px; }
.a-segbar__part { position: relative; flex: var(--w, 1) 1 0; min-width: 0; background: var(--c); border-radius: 4px; transition: flex-grow var(--dur-3) var(--ease-out), filter var(--dur-1); }
.a-segbar:not(.a-segbar--tall) .a-segbar__part { border-radius: 999px; }
.a-segbar__part:hover { filter: brightness(1.15); }
.a-segbar__part > span { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); font: 600 12px var(--font-sans); color: var(--on, #fff); white-space: nowrap; pointer-events: none; }
.a-segbar__legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--ink-2); }
.a-segbar__legend span { display: inline-flex; align-items: center; gap: 7px; }
.a-segbar__legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; }

/* ───────────────────────────── table ───────────────────────────── */
.a-tablewrap { overflow: auto; border-radius: inherit; max-height: var(--a-table-max, none); }
.a-table { width: 100%; border-collapse: collapse; font-size: 13px; }
/* captions name the table for screen readers; pass captionVisible: true to Aurora.table to show them */
.a-table caption { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.a-table--captioned caption { position: static; width: auto; height: auto; margin: 0; overflow: visible; clip: auto; white-space: normal; text-align: left; padding: 0 14px 8px; color: var(--ink-3); font-size: 12px; caption-side: bottom; }
.a-table th { position: sticky; top: 0; z-index: 1; text-align: left; padding: 10px 14px; white-space: nowrap; background: color-mix(in oklab, var(--surface-1) 94%, transparent); border-bottom: 1px solid var(--line); font: 600 11px var(--font-sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
.a-table th[data-align="right"], .a-table td[data-align="right"] { text-align: right; font-variant-numeric: tabular-nums; }
.a-table th[data-align="center"], .a-table td[data-align="center"] { text-align: center; }
.a-table th button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-transform: inherit; letter-spacing: inherit; }
.a-table th button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
.a-table th[aria-sort] button { color: var(--ink-1); }
.a-table td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; color: var(--ink-1); max-width: 520px; overflow: hidden; text-overflow: ellipsis; }
.a-table td.is-mono { font-family: var(--font-mono); font-size: 12.5px; }
.a-table tbody tr { transition: background-color var(--dur-1); }
.a-table tbody tr:hover { background: color-mix(in oklab, var(--ink-1) 3.5%, transparent); }
.a-table tbody tr:last-child td { border-bottom: 0; }
.a-table tr[data-clickable] { cursor: pointer; }
.a-table--dense td { padding: 6px 12px; } .a-table--dense th { padding: 8px 12px; }
.a-toolbar { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.a-toolbar .a-input { max-width: 320px; height: 32px; }
.a-pager { display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-3); }

/* ───────────────────────────── page-wide drop overlay ───────────────────────────── */
.a-pagedrop { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 24px; background: color-mix(in oklab, var(--bg-0) 72%, transparent); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); pointer-events: none; }
.a-pagedrop__card { display: grid; justify-items: center; gap: 10px; padding: 34px 46px; text-align: center; border-radius: 22px; border: 2px dashed var(--accent-line); background: var(--surface-2); color: var(--ink-1); animation: a-fade-up var(--dur-2) var(--ease-out) both; }
.a-pagedrop__card strong { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
.a-pagedrop__card span { color: var(--ink-2); font-size: 13px; }

/* ───────────────────────────── key-value · code · details · tag · feed ───────────────────────────── */
.a-kv { display: grid; grid-template-columns: minmax(110px, max-content) minmax(0, 1fr); margin: 0; font-size: 13px; }
.a-kv > dt, .a-kv > dd { margin: 0; padding: 9px 0; border-bottom: 1px solid var(--line); }
.a-kv > dt { padding-right: 24px; color: var(--ink-3); font-weight: 500; }
.a-kv > dd { color: var(--ink-1); overflow-wrap: anywhere; }
.a-kv > dt:nth-last-of-type(1), .a-kv > dd:last-of-type { border-bottom: 0; }
.a-kv--mono > dd { font: 500 12.5px var(--font-mono); }
@media (max-width: 560px) { .a-kv { grid-template-columns: minmax(0, 1fr); } .a-kv > dt { padding-bottom: 0; border-bottom: 0; } }
.a-code-wrap { position: relative; }

/* the rail becomes a bar with room for the seven sections only: the tools go (the search button still opens the palette, which offers the export) */
@media (max-width: 760px) {
  .a-rail__group:has(> .a-rail__item[data-id="json"]) { display: none; }
}
/* controls in a card header (the resolution tabs next to Chart/Table) wrap instead of running out of the card */
@media (max-width: 640px) {
  .gs-section .a-card__actions { flex-wrap: wrap; margin-left: 0; }
}
/* breadcrumbs: the current section is never cut, the repository name gives way first, then the product name */
.a-crumbs strong { flex: none; }
@media (max-width: 560px) {
  .a-crumbs > :first-child, .a-crumbs > :first-child + svg { display: none; }
}

/* ── no-JavaScript summary ── */
.gs-noscript { display: grid; gap: 14px; max-width: 52rem; margin: 0 auto; padding: 32px 20px; }
.gs-noscript h1 { margin: 0; font-size: 28px; font-weight: 600; overflow-wrap: anywhere; }
.gs-noscript dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: 12px; margin: 0; }
.gs-noscript dl > div { padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); }
.gs-noscript dt { font-size: 12px; color: var(--ink-3); }
.gs-noscript dd { margin: 0; font-size: 24px; font-weight: 600; }
</style>

          s.appendChild(rect); cellEls.push({ el: rect, d, cx: +rect.getAttribute('x') + cs / 2, cy: +rect.getAttribute('y') });
        });
        titleFor = (item) => ({ title: dtf.format(new Date(item.d.t)), rows: [{ name: opts.unit ? opts.unit.charAt(0).toUpperCase() + opts.unit.slice(1) : 'Value', value: vf(item.d.v) }] });
        tableRows = days.map((d) => ({ a: fmt.date(d.t, { utc: true }), b: d.v })); tableCols = [{ key: 'a', label: 'Date' }, { key: 'b', label: opts.unit ? opts.unit.charAt(0).toUpperCase() + opts.unit.slice(1) : 'Value', align: 'right', format: (v) => vf(v) }];
      } else {
        const rowsL = (opts.rows || []).map(String); const colsL = (opts.cols || []).map(String);
        const labelW = clamp(Math.max.apply(null, [3].concat(rowsL.map((r) => tw(r)))) + 12, 28, 120);
        const top = 20; const gap = 2;
        const cw = (width - labelW) / Math.max(1, colsL.length); const ch = clamp(cw, 14, 26);
        const height = top + rowsL.length * ch;
        s = svg('svg', { width, height, viewBox: `0 0 ${width} ${height}`, role: 'img', tabindex: '0', 'aria-label': opts.ariaLabel || opts.title || 'Heatmap' });
        const stride = Math.max(1, Math.ceil(36 / Math.max(1, cw)));
        colsL.forEach((c, j) => { if (j % stride === 0) s.appendChild(svg('text', { x: labelW + j * cw + cw / 2, y: 12, 'text-anchor': 'middle' }, truncate(c, Math.max(2, Math.floor((cw * stride) / 6))))); });
        rowsL.forEach((r, i) => s.appendChild(svg('text', { x: labelW - 8, y: top + i * ch + ch / 2 + 4, 'text-anchor': 'end' }, r)));
        const grid = new Map();
        (opts.cells || []).forEach((c) => {
          const i = typeof c.row === 'number' ? c.row : rowsL.indexOf(String(c.row)); const j = typeof c.col === 'number' ? c.col : colsL.indexOf(String(c.col));
          if (i >= 0 && j >= 0) grid.set(`${i}:${j}`, (grid.get(`${i}:${j}`) || 0) + (+c.value || 0));
        });
        valuesAll = Array.from(grid.values());
        const lv = levelFn(valuesAll);
        for (let i = 0; i < rowsL.length; i++) for (let j = 0; j < colsL.length; j++) {
          const v = grid.get(`${i}:${j}`) || 0;
          const rect = svg('rect', { class: `a-cell${animateNext ? ' is-in' : ''}`, x: labelW + j * cw + gap / 2, y: top + i * ch + gap / 2, width: Math.max(2, cw - gap), height: ch - gap, rx: 3, style: { fill: `var(--seq-${lv(v)})`, '--i': j } });
          s.appendChild(rect); cellEls.push({ el: rect, d: { i, j, v }, cx: labelW + j * cw + cw / 2, cy: top + i * ch });
        }
        titleFor = (item) => ({ title: `${rowsL[item.d.i]} · ${colsL[item.d.j]}`, rows: [{ name: opts.unit ? opts.unit.charAt(0).toUpperCase() + opts.unit.slice(1) : 'Value', value: vf(item.d.v) }] });
        tableRows = []; rowsL.forEach((r, i) => colsL.forEach((c, j) => { const v = grid.get(`${i}:${j}`); if (v) tableRows.push({ a: r, b: c, c: v }); }));
        tableCols = [{ key: 'a', label: opts.rowLabel || 'Row' }, { key: 'b', label: opts.colLabel || 'Column' }, { key: 'c', label: opts.unit ? opts.unit.charAt(0).toUpperCase() + opts.unit.slice(1) : 'Value', align: 'right', format: (v) => vf(v) }];
      }
      renderScale(vf, valuesAll.length ? Math.max.apply(null, valuesAll) : 0);
      let activeCell = -1;
      const setActive = (i, cx, cy) => {
        if (activeCell >= 0 && cellEls[activeCell]) cellEls[activeCell].el.classList.remove('is-active');
        activeCell = i;
        if (i < 0) { Tip.hide(); return; }
        const item = cellEls[i]; item.el.classList.add('is-active');
        if (cx == null) { const r = s.getBoundingClientRect(); cx = r.left + item.cx; cy = r.top + item.cy; }
        const spec = titleFor(item);
        Tip.show(spec, cx, cy);
        sr.textContent = `${spec.title}: ${spec.rows[0].value}${unit}`;
      };
      cellEls.forEach((item, i) => {
        item.el.addEventListener('pointermove', (e) => setActive(i, e.clientX, e.clientY));
        item.el.addEventListener('pointerleave', () => setActive(-1));
      });
      s.addEventListener('keydown', (e) => {
        const next = e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? -1 : 0;
        if (next) { e.preventDefault(); setActive(clamp(activeCell < 0 ? 0 : activeCell + next, 0, cellEls.length - 1)); } else if (e.key === 'Escape') setActive(-1);
      });
      s.addEventListener('focus', () => { if (activeCell < 0) setActive(cellEls.length - 1); });
      s.addEventListener('blur', () => setActive(-1));
      svgEl = swap(host, legendHost, svgEl, s);
      animateNext = false;
    }
    const ro = watch(host, () => { animateNext = false; render(); });
    render();
    return {
      el: host,
      update(next) { opts = Object.assign({}, opts, next || {}); animateNext = opts.animate !== false; render(); },
      destroy() { if (ro) ro.disconnect(); Tip.hide(); host.remove(); },
      table() { return { caption: opts.title || 'Heatmap data', columns: tableCols, rows: tableRows }; },
    };
  }
  AC.heatmap = heatmap;

  /* ───────────────────────── sparkline ───────────────────────── */
  function spark(parent, o) {
    o = o || {};
    const w = o.width || 96; const h = o.height || 28;
    const holder = el('span', { class: 'a-spark-wrap', role: 'img' });
    parent.appendChild(holder);
    function render(values) {
      while (holder.firstChild) holder.removeChild(holder.firstChild);
      const v = (values || []).map(Number).filter(finite);
      holder.setAttribute('aria-label', v.length ? `Trend of ${v.length} points, latest ${fmt.compact(v[v.length - 1])}` : 'No trend data');
      const s = svg('svg', { class: 'a-spark', width: w, height: h, viewBox: `0 0 ${w} ${h}`, 'aria-hidden': 'true' });
      if (v.length) {
        const lo = Math.min.apply(null, v); const hi = Math.max.apply(null, v); const span = hi - lo || 1;
        const pad = 4; const x = (i) => (v.length === 1 ? w / 2 : pad + (i / (v.length - 1)) * (w - pad * 2));
        const y = (val) => h - pad - ((val - lo) / span) * (h - pad * 2);
        if (o.kind === 'bars') {
          const bw = Math.max(2, (w - pad * 2) / v.length - 2);
          v.forEach((val, i) => s.appendChild(svg('rect', { x: x(i) - bw / 2, y: y(val), width: bw, height: Math.max(2, h - pad - y(val)), rx: 1.5, style: { fill: i === v.length - 1 ? 'var(--series-1)' : 'var(--chart-muted)' } })));
        } else {
          const pts = v.map((val, i) => [+x(i).toFixed(2), +y(val).toFixed(2)]);
          s.appendChild(svg('path', { class: 'a-line', d: linearPath(pts) }));
          if (pts.length > 1) s.appendChild(svg('path', { class: 'a-line', d: linearPath(pts.slice(-2)), style: { stroke: 'var(--series-1)' } }));
          const last = pts[pts.length - 1];
          s.appendChild(svg('circle', { class: 'a-last', cx: last[0], cy: last[1], r: 3 }));
        }
      }
      holder.appendChild(s);
    }
    render(o.values);
    return { el: holder, update: render };
  }
  AC.spark = spark;

  /* ───────────────────────── ring meter ───────────────────────── */
  const KIND_COLOR = { info: 'var(--accent-1)', good: 'var(--good)', warn: 'var(--warn)', serious: 'var(--serious)', critical: 'var(--critical)' };
  function ring(parent, o) {
    o = o || {};
    const size = o.size || 168; const sw = Math.max(10, Math.round(size * 0.085));
    const r = (size - sw) / 2; const C = 2 * Math.PI * r; const max = o.max || 100;
    const f = o.format || fmt.int;
    const thresholds = (o.thresholds || [{ at: 0.4, kind: 'warn' }, { at: 0.7, kind: 'critical' }]).slice().sort((a, b) => a.at - b.at);
    const fill = svg('circle', { class: 'a-ring__fill', cx: size / 2, cy: size / 2, r, 'stroke-width': sw, 'stroke-dasharray': C, 'stroke-dashoffset': C });
    const valueEl = el('div', { class: 'a-ring__value' }, '0');
    const node = el('div', { class: 'a-ring', role: 'img', style: { width: `${size}px`, height: `${size}px`, '--ring-size': `${size}px` } },
      svg('svg', { width: size, height: size, viewBox: `0 0 ${size} ${size}`, 'aria-hidden': 'true' }, svg('circle', { class: 'a-ring__track', cx: size / 2, cy: size / 2, r, 'stroke-width': sw }), fill),
      el('div', { class: 'a-ring__label' }, valueEl, o.sublabel ? el('div', { class: 'a-ring__sub' }, o.sublabel) : null));
    parent.appendChild(node);
    let current = 0;
    function set(v) {
      const ratio = clamp(v / max, 0, 1);
      let kind = o.baseKind || 'info';
      thresholds.forEach((t) => { if (ratio >= t.at) kind = t.kind; });
      node.style.setProperty('--_c', KIND_COLOR[kind] || KIND_COLOR.info);
      node.setAttribute('aria-label', `${o.label || 'Score'}: ${f(v)} of ${f(max)}`);
      fill.style.strokeDashoffset = String(C * (1 - ratio));
      A.countUp(valueEl, v, { from: current, format: f, duration: 1100 });
      current = v;
    }
    root.requestAnimationFrame(() => root.requestAnimationFrame(() => set(o.value || 0)));
    return { el: node, update: set };
  }
  AC.ring = ring;

  /* ───────────────────────── chart card (title + Chart|Table toggle) ───────────────────────── */
  function card(parent, o) {
    o = o || {};
    const body = el('div', { class: 'a-card__body' });
    const tableHost = el('div', { class: 'a-card__body', hidden: true });
    let chart = null;
    const bChart = el('button', { class: 'a-chip', type: 'button', 'aria-pressed': 'true', onclick: () => showTable(false) }, 'Chart');
    const bTable = el('button', { class: 'a-chip', type: 'button', 'aria-pressed': 'false', onclick: () => showTable(true) }, 'Table');
    const toggle = el('div', { class: 'a-row', role: 'group', 'aria-label': 'View', style: { '--gap': '4px', flexWrap: 'nowrap' } }, bChart, bTable);
    const head = el('div', { class: 'a-card__head' },
      el('div', null, el('div', { class: 'a-card__title' }, o.title || ''), o.subtitle ? el('div', { class: 'a-card__sub' }, o.subtitle) : null),
      el('div', { class: 'a-card__actions' }, o.actions || null, toggle));
    const node = el('section', { class: 'a-card a-reveal', 'aria-label': o.title || 'Chart' }, head, body, tableHost);
    parent.appendChild(node);
    A.reveal(node);
    chart = o.render ? o.render(body) : null;
    if (!chart || !chart.table) toggle.hidden = true;
    function showTable(on) {
      if (!chart || !chart.table) return;
      bChart.setAttribute('aria-pressed', String(!on));
      bTable.setAttribute('aria-pressed', String(on));
      body.hidden = on; tableHost.hidden = !on;
      Tip.hide();
      if (on) {
        while (tableHost.firstChild) tableHost.removeChild(tableHost.firstChild);
        const t = chart.table();
        A.table(tableHost, { columns: t.columns, rows: t.rows, caption: t.caption, dense: true, pageSize: 12, sort: null });
      }
    }
    return { el: node, body, get chart() { return chart; }, setChart(c) { chart = c; toggle.hidden = !(c && c.table); }, showTable };
  }
  AC.card = card;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* gitstory report: renders the metrics (gitstory.metrics/v1) into the Aurora layout.
 *
 * The data arrives as an inert JSON block; every string is placed with textContent (through
 * Aurora.el), never as HTML, so nothing from the repository can become markup or script. */
(function () {
  'use strict';

  const A = window.Aurora;
  const C = window.AuroraCharts;
  const el = A.el;
  const fmt = A.fmt;

  // `--theme dark|light` is written into the page and beats the visitor's stored choice;
  // with `auto` the choice made with the toggle wins.
  const pinnedTheme = document.documentElement.getAttribute('data-theme');
  A.init({ forceTheme: pinnedTheme === 'dark' || pinnedTheme === 'light' });

  const data = JSON.parse(document.getElementById('report-data').textContent);
  const live = document.body.getAttribute('data-live') === 'true';
  const repo = data.repository;
  const hasCommits = data.totals.commits > 0;

  // The sections of the report, in page order: the rail, the breadcrumbs, the command palette and
  // the scroll spy all read this table. An empty history only has the first one.
  const SECTIONS = [
    ['story', 'Story', 'book'],
    ['activity', 'Activity', 'activity'],
    ['people', 'People', 'users'],
    ['code', 'Code', 'code'],
    ['messages', 'Messages', 'message'],
    ['releases', 'Releases', 'tag'],
    ['card', 'README card', 'image'],
  ];
  const sections = hasCommits ? SECTIONS : SECTIONS.slice(0, 1);

  /* ── small helpers ─────────────────────────────────────────────────────────────────────── */

  const int = (n) => fmt.int(n);
  const pct = (ratio, digits) => fmt.pct(ratio, digits == null ? 0 : digits);
  const plural = (n, one, many) => `${int(n)} ${n === 1 ? one : many || `${one}s`}`;
  const day = (iso) => String(iso || '').slice(0, 10);
  const localDate = (iso) => new Date(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10));
  const dateText = new Intl.DateTimeFormat('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
  const monthText = new Intl.DateTimeFormat('en-US', { year: 'numeric', month: 'short' });
  const NBSP = String.fromCharCode(160);
  // a date is not broken across lines
  const longDate = (iso) => dateText.format(localDate(day(iso))).split(' ').join(NBSP);
  const hourText = (h) => `${String(h).padStart(2, '0')}:00`;
  const lastMinute = (to) => `${String((to + 23) % 24).padStart(2, '0')}:59`;
  const add = (list) => list.reduce((total, n) => total + n, 0);

  function spanText(days) {
    const years = Math.floor(days / 365);
    const months = Math.floor((days % 365) / 30);
    if (years && months) return `${plural(years, 'year')} ${plural(months, 'month')}`;
    if (years) return plural(years, 'year');
    if (months) return plural(months, 'month');
    return plural(days, 'day');
  }

  function shortSpan(days) {
    const years = Math.floor(days / 365);
    const months = Math.floor((days % 365) / 30);
    return [years ? `${years}y` : '', months ? `${months}m` : ''].filter(Boolean).join(' ') || `${days}d`;
  }

  // A hint that keeps each date in one piece: the line may break between the parts, not inside one.
  const nowrap = (text) => el('span', { class: 'gs-nowrap' }, text);
  function richHint(stat, parts) {
    const hint = stat.el.querySelector('.a-stat__hint');
    if (!hint) return;
    while (hint.firstChild) hint.removeChild(hint.firstChild);
    parts.forEach((part) => hint.appendChild(typeof part === 'string' ? document.createTextNode(part) : part));
  }
  function statTile(parent, options) {
    const stat = A.stat(parent, options);
    if (options.rich) richHint(stat, options.rich);
    return stat;
  }

  function cell(parent, cls) {
    const node = el('div', { class: cls });
    parent.appendChild(node);
    return node;
  }

  function onVisible(node, fn) {
    if (!('IntersectionObserver' in window)) { fn(); return; }
    const io = new IntersectionObserver((entries) => {
      if (entries.some((e) => e.isIntersecting)) { io.disconnect(); fn(); }
    }, { threshold: 0.3 });
    io.observe(node);
  }

  function filterChips() {
    const f = data.filters;
    const chips = [];
    if (f.since) chips.push(`since ${day(f.since)}`);
    if (f.until) chips.push(`until ${day(f.until)}`);
    if (f.author) chips.push(`author: ${f.author}`);
    if (f.branch) chips.push(`rev: ${f.branch}`);
    f.paths.forEach((p) => chips.push(`path: ${p}`));
    if (f.noMerges) chips.push('no merge commits');
    if (f.maxCommits) chips.push(`latest ${int(f.maxCommits)} commits`);
    return chips;
  }

  /* ── the data export, the live page and the Charts/Tables switch ─────────────────────── */

  function slug(text) {
    return String(text).replace(/[^A-Za-z0-9._-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'report';
  }

  function downloadJson() {
    const blob = new Blob([`${JSON.stringify(data, null, 2)}\n`], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const link = el('a', { download: `${slug(repo.name)}-gitstory.json` });
    link.href = url;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  // A page served by `gitstory serve` shows a live indicator and a refresh button in the top bar.
  function setupLive() {
    if (!live) return { nodes: [], refresh: null };
    const status = A.live(null, { label: 'Live' });
    status.set('live', 'Live');
    const label = 'Refresh the data from the repository';
    const button = el('button', { class: 'a-nav-btn', type: 'button', 'aria-label': label, title: label }, A.icon('refresh', { size: 17 }));
    async function refresh() {
      status.set('connecting', 'Refreshing…');
      try {
        const response = await fetch('/api/refresh', { method: 'POST' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const info = await response.json();
        if (info.generatedAt !== data.generatedAt) { window.location.reload(); return; }
        status.set('live', 'Live');
        A.toast('Already up to date', { kind: 'info' });
      } catch {
        status.set('offline', 'Offline');
        A.toast('The gitstory server did not answer. Is it still running?', { kind: 'critical' });
      }
    }
    button.addEventListener('click', refresh);
    return { nodes: [status.el, button], refresh };
  }

  // Every chart card can show its data as a table; the view switch of the sub bar flips them all.
  const cards = [];
  function chartCard(parent, options) {
    const card = C.card(parent, options);
    cards.push(card);
    return card;
  }
  const withTable = () => cards.filter((card) => card.chart && card.chart.table);
  function showAll(mode) {
    withTable().forEach((card) => card.showTable(mode === 'tables'));
  }

  /* ── the Aurora shell: rail, top bar, sub bar and status bar ──────────────────────────── */

  const crumbs = (label) => [{ label: 'gitstory', href: '#story' }, repo.name, label];

  // A small fact in the sub bar. The label hides on narrow screens; the value stays.
  function pill(icon, label, value, title) {
    return el('span', { class: 'a-pill', title: title || null },
      A.icon(icon, { size: 14 }),
      el('span', { class: 'a-pill__label' }, label),
      value == null ? null : el('span', { class: 'a-pill__count' }, el('span', { class: 'gs-ellipsis' }, String(value))));
  }

  function contextPills() {
    const t = data.totals;
    const pills = [pill('git-branch', 'Branch', repo.detached ? 'detached' : repo.branch, `HEAD ${repo.head}`)];
    if (hasCommits) {
      pills.push(pill('git-commit', 'Commits', int(t.commits), `${plural(t.mergeCommits, 'merge commit')} included`));
      pills.push(pill('users', 'Authors', int(t.authors)));
      pills.push(pill('calendar', 'Span', shortSpan(t.spanDays), `${day(t.firstCommitAt)} → ${day(t.lastCommitAt)}`));
    }
    const chips = filterChips();
    if (chips.length) pills.push(pill('filter', 'Filtered', chips.length, chips.join(' · ')));
    return pills;
  }

  const liveControls = setupLive();
  const generated = data.generatedAt.replace('T', ' ').replace('Z', ' UTC');
  const shell = A.shell({
    brand: { name: 'gitstory', href: '#story', mark: 'git-commit' },
    rail: [
      sections.map(([id, label, icon]) => ({ id, label, icon, href: `#${id}`, active: id === 'story' })),
      'spacer',
      [
        { id: 'json', label: 'Download the metrics as JSON', icon: 'download', onClick: downloadJson },
        { id: 'palette', label: 'Command palette', icon: 'command', cmdk: true },
      ],
    ],
    crumbs: crumbs('Story'),
    actions: liveControls.nodes,
    views: hasCommits ? {
      ariaLabel: 'How the charts are shown',
      active: 'charts',
      items: [{ id: 'charts', label: 'Charts', icon: 'bar-chart' }, { id: 'tables', label: 'Tables', icon: 'list' }],
      onChange: showAll,
    } : null,
    subbarEnd: contextPills(),
    status: {
      start: [`gitstory ${data.generator.version}`, 'Generated offline · nothing was uploaded'],
      end: [data.schema, generated],
    },
  });

  // The page itself: one column of sections inside the container the shell made.
  const app = el('div', { class: 'gs-page' });
  shell.container.appendChild(app);
  app.addEventListener('click', (event) => {
    if (!shell.views || !event.target.closest || !event.target.closest('.a-card__actions .a-chip')) return;
    const all = withTable();
    const tables = all.filter((card) => card.body.hidden).length;
    if (tables === all.length) shell.views.select('tables', true);
    else if (tables === 0) shell.views.select('charts', true);
  });

  /* ── page building blocks ──────────────────────────────────────────────────────────────── */

  function section(id, title, lead) {
    const head = el('div', { class: 'a-pagehead gs-section__head' },
      el('div', null,
        el('h2', { class: 'a-h2', id: `${id}-title` }, title),
        lead ? el('p', { class: 'a-pagehead__sub gs-lead' }, lead) : null));
    const grid = el('div', { class: 'a-grid' });
    const root = el('section', { class: 'gs-section', id, 'aria-labelledby': `${id}-title` }, head, grid);
    app.appendChild(root);
    return grid;
  }

  function panel(parent, title, sub) {
    const body = el('div', { class: 'a-card__body gs-panel' });
    const card = el('section', { class: 'a-card a-reveal', 'aria-label': title },
      el('div', { class: 'a-card__head' },
        el('div', null, el('div', { class: 'a-card__title' }, title), sub ? el('div', { class: 'a-card__sub' }, sub) : null)),
      body);
    parent.appendChild(card);
    return body;
  }

  function notice(kind, title, lines) {
    return el('div', { class: 'a-card gs-notice a-reveal', role: 'note' },
      el('div', { class: 'gs-notice__head' }, A.badge(title, { kind })),
      el('ul', { class: 'gs-notice__list' }, lines.map((line) => el('li', null, line))));
  }

  /* ── story: title, key numbers, highlights ─────────────────────────────────────────────── */

  function renderStory() {
    const t = data.totals;
    const lead = t.commits
      ? `${plural(t.commits, 'commit')} by ${plural(t.authors, 'author')} over ${spanText(t.spanDays)}, from ${longDate(t.firstCommitAt)} to ${longDate(t.lastCommitAt)}.`
      : 'No commits matched the filters of this report.';
    // a long name is cut with an ellipsis; the title attribute keeps the whole text
    const tag = (text, hint) => el('span', { class: 'a-tag', title: hint ? `${hint}: ${text}` : text }, text);
    const meta = el('div', { class: 'a-row gs-meta' },
      tag(repo.detached ? 'detached HEAD' : `branch ${repo.branch}`),
      tag(`HEAD ${repo.head}`));
    if (repo.shallow) meta.appendChild(A.badge('shallow clone', { kind: 'warn', title: 'The history is truncated; the numbers cover only what was fetched.' }));
    filterChips().forEach((text) => meta.appendChild(tag(text, 'Filter applied to this report')));

    const root = el('section', { class: 'gs-story', id: 'story', 'aria-labelledby': 'story-title' },
      el('div', { class: 'a-hero gs-hero' },
        el('p', { class: 'a-greet' }, 'gitstory · repository report'),
        el('h1', { class: 'a-headline', id: 'story-title', title: repo.name }, repo.name),
        el('p', { class: 'a-lede' }, lead),
        meta));
    app.appendChild(root);

    if (data.warnings.length && t.commits) root.appendChild(notice('warn', 'Heads up', data.warnings));
    if (!t.commits) {
      const empty = el('div', { class: 'a-card' });
      root.appendChild(empty);
      A.empty(empty, { title: 'Nothing to show', text: data.warnings[0] || 'Try a wider date range or another branch.', icon: 'search' });
      return false;
    }

    const kpis = el('div', { class: 'gs-kpis', role: 'group', 'aria-label': 'Key figures' });
    root.appendChild(kpis);
    const weekly = data.activity.byWeek.map((w) => w.commits).slice(-26);
    const hero = A.stat(cell(kpis, 'gs-kpi-hero'), {
      label: 'Commits', value: t.commits, format: 'int', hero: true,
      hint: `${plural(t.mergeCommits, 'merge commit')} included · ${t.commitsPerActiveDay} per active day`,
    });
    if (weekly.length > 1) {
      const trend = el('div', { class: 'gs-hero-trend' }, el('div', { class: 'a-stat__hint' }, `Commits per week, last ${weekly.length} weeks`));
      // about 13px a bar: a short history gets a small trend, not a few wide blocks
      C.spark(trend, { values: weekly, width: Math.min(340, 8 + weekly.length * 13), height: 64, kind: 'bars' });
      hero.el.querySelector('.a-stat__row').appendChild(trend);
    }
    const tiles = [
      { label: 'Authors', value: t.authors, hint: `bus factor ${data.busFactor.value} (a heuristic)` },
      { label: 'Active days', value: t.activeDays, hint: `${pct(t.spanDays ? t.activeDays / t.spanDays : 0)} of the days in the range` },
      {
        label: 'Longest streak', value: data.streaks.longest,
        hint: data.streaks.longest ? 'days in a row' : 'no streak',
        rich: data.streaks.longest ? ['days in a row, ', nowrap(day(data.streaks.longestFrom)), ' → ', nowrap(day(data.streaks.longestTo))] : null,
      },
      { label: 'Lines changed', value: t.additions + t.deletions, format: 'compact', hint: `+${int(t.additions)} / −${int(t.deletions)}` },
    ];
    tiles.forEach((tile) => statTile(cell(kpis, 'gs-kpi-small'), tile));
    return true;
  }

  const FACT_ICON = {
    currentStreak: 'bolt', busiestDay: 'calendar', chronotype: 'clock', topAuthor: 'user', busFactor: 'shield',
    biggestCommit: 'git-commit', topLanguage: 'code', hotFile: 'file', longestGap: 'pause', commitStyle: 'hash',
    releases: 'tag', signatureWord: 'message',
  };
  const IN_KPIS = new Set(['commits', 'activeDays', 'longestStreak']);

  function renderFacts() {
    const facts = data.highlights.filter((h) => !IN_KPIS.has(h.id));
    if (!facts.length) return;
    // the cards below are level 3 headings: they need a level 2 above them, which only a screen reader meets
    const story = document.getElementById('story');
    story.appendChild(el('h2', { class: 'a-sr-only', id: 'highlights-title' }, 'Highlights'));
    const grid = el('div', { class: 'gs-facts', role: 'list', 'aria-labelledby': 'highlights-title' });
    facts.forEach((fact) => {
      const numeric = typeof fact.value === 'number';
      const value = el('div', { class: `gs-fact__value${numeric ? '' : ' gs-fact__value--text'}` }, numeric ? '0' : String(fact.value));
      const card = el('article', { class: 'a-card gs-fact a-reveal', role: 'listitem' },
        el('h3', { class: 'gs-fact__title' }, A.icon(FACT_ICON[fact.id] || 'sparkle', { size: 14 }), fact.title),
        value,
        el('p', { class: 'gs-fact__caption' }, fact.caption));
      grid.appendChild(card);
      if (numeric) onVisible(card, () => A.countUp(value, fact.value, { format: 'int', duration: 1100 }));
    });
    story.appendChild(grid);
  }

  /* ── activity ──────────────────────────────────────────────────────────────────────────── */

  function peakOf(rows, key) {
    return rows.reduce((best, row) => (row.commits > best.commits ? row : best), { commits: -1, [key]: '' });
  }

  function renderActivity() {
    const t = data.totals;
    const months = data.activity.byMonth;
    const peak = peakOf(months, 'month');
    const share = t.spanDays ? t.activeDays / t.spanDays : 0;
    const lead = `Commits landed on ${int(t.activeDays)} of ${plural(t.spanDays, 'day')} (${pct(share)}).` +
      (peak.commits > 0 ? ` The busiest month was ${monthText.format(new Date(+peak.month.slice(0, 4), +peak.month.slice(5, 7) - 1, 1))}, with ${plural(peak.commits, 'commit')}.` : '');
    const grid = section('activity', 'Activity', lead);

    const cal = data.activity.calendar;
    chartCard(cell(grid, 'a-span-12'), {
      title: 'Activity calendar',
      subtitle: `Commits per day up to ${cal.to} · ${plural(cal.total, 'commit')} in the last ${cal.weeks} weeks`,
      render: (body) => C.heatmap(body, {
        kind: 'calendar', unit: 'commits', end: cal.to,
        cells: cal.days.map((d) => ({ date: d.date, value: d.commits })),
        ariaLabel: 'Commits per day over the last year',
      }),
    });

    renderOverTime(cell(grid, 'a-span-8'));
    renderRhythm(cell(grid, 'a-span-4'));

    const wh = data.activity.weekdayHour;
    const matrix = [];
    wh.matrix.forEach((row, r) => row.forEach((value, c) => matrix.push({ row: r, col: c, value })));
    chartCard(cell(grid, 'a-span-12'), {
      title: 'Weekday and hour',
      subtitle: 'Commits by the author’s local time',
      render: (body) => C.heatmap(body, {
        kind: 'matrix', unit: 'commits', rows: wh.weekdays, cols: Array.from({ length: 24 }, (_, h) => String(h).padStart(2, '0')),
        cells: matrix, rowLabel: 'Weekday', colLabel: 'Hour', ariaLabel: 'Commits by weekday and hour',
      }),
    });
  }

  function renderOverTime(host) {
    const a = data.activity;
    const views = {
      month: { label: 'Monthly', rows: a.byMonth, when: (r) => new Date(+r.month.slice(0, 4), +r.month.slice(5, 7) - 1, 1), text: (d) => monthText.format(d), axis: 'Month' },
      week: { label: 'Weekly', rows: a.byWeek, when: (r) => localDate(r.start), text: (d) => `Week of ${dateText.format(d)}`, axis: 'Week' },
      year: { label: 'Yearly', rows: a.byYear, when: (r) => new Date(r.year, 0, 1), text: (d) => String(d.getFullYear()), axis: 'Year' },
    };
    // a line through one or two points says nothing: such a resolution is not offered
    const available = Object.keys(views).filter((k) => views[k].rows.length >= 3);
    const options = (id) => {
      const view = views[id];
      return {
        series: [{ id: 'commits', name: 'Commits', color: 1, values: view.rows.map((r) => ({ x: view.when(r), y: r.commits })) }],
        x: { type: 'time', label: view.axis, tooltipFormat: (ms) => view.text(new Date(ms)) },
        y: { label: 'Commits', format: fmt.compact },
      };
    };
    const tabsHost = el('div');
    let chart = null;
    const holder = chartCard(host, {
      title: 'Commits over time',
      subtitle: 'Per calendar month, week or year',
      actions: [tabsHost],
      render: (body) => {
        if (!available.length) {
          A.empty(body, { title: 'Not enough history yet', text: 'A trend needs commits in at least three different months, weeks or years.', icon: 'clock' });
          return null;
        }
        chart = C.line(body, Object.assign({ area: true, height: 280, legend: 'never', ariaLabel: 'Commits over time' }, options(available[0])));
        return chart;
      },
    });
    if (available.length > 1) {
      A.tabs(tabsHost, {
        ariaLabel: 'Time resolution',
        tabs: available.map((id) => ({ id, label: views[id].label })),
        active: available[0],
        onChange: (id) => { chart.update(options(id)); if (holder.body.hidden) holder.showTable(true); },
      });
    }
  }

  function renderRhythm(host) {
    const ch = data.chronotype;
    const body = panel(host, 'Daily rhythm', 'Local time of the author');
    body.appendChild(el('div', { class: 'gs-rhythm__label' }, ch.label));
    const best = ch.windows.find((w) => w.id === ch.type);
    body.appendChild(el('p', { class: 'a-muted gs-rhythm__caption' },
      best ? `${pct(best.share)} of commits land between ${hourText(best.from)} and ${lastMinute(best.to)}.` : 'Too few commits to call it.'));
    A.segbar(body, {
      tall: true, valueFormat: int,
      parts: ch.windows.map((w) => ({ name: `${w.label} ${hourText(w.from)}–${hourText(w.to % 24)}`, value: w.commits })),
    });
    const perDay = data.activity.weekdayHour.matrix.map(add);
    const busiestDay = perDay.indexOf(Math.max.apply(null, perDay));
    const weekend = (perDay[5] + perDay[6]) / Math.max(1, add(perDay));
    A.kv(body, [
      ['Peak hour', ch.peakHour == null ? '–' : `${hourText(ch.peakHour)}–${hourText((ch.peakHour + 1) % 24)}`],
      ['Busiest weekday', `${data.activity.weekdayHour.weekdays[busiestDay]} (${plural(perDay[busiestDay], 'commit')})`],
      ['On weekends', pct(weekend)],
    ]);
  }

  /* ── people ────────────────────────────────────────────────────────────────────────────── */

  function renderPeople() {
    const au = data.authors;
    const top = au.items[0];
    const lead = `${plural(au.total, 'author')} contributed.` +
      (top && !top.other ? ` ${top.name} wrote ${pct(top.share)} of the commits.` : '');
    const grid = section('people', 'People', lead);

    chartCard(cell(grid, 'a-span-8'), {
      title: 'Top authors',
      subtitle: au.items.some((a) => a.other) ? `The ${au.limit} most active, then everyone else` : 'Commits per author',
      render: (body) => C.bars(body, {
        orientation: 'horizontal', valueLabel: 'Commits', labelHeader: 'Author', valueFormat: int, title: 'Top authors',
        data: au.items.map((a, i) => ({
          id: i,
          label: a.other ? `Others (${int(a.members)})` : a.name,
          value: a.commits,
          sub: `${pct(a.share, 1)} of commits · +${int(a.additions)} / −${int(a.deletions)} lines · ${plural(a.activeDays, 'active day')} · ${day(a.firstCommitAt)} → ${day(a.lastCommitAt)}`,
        })),
      }),
    });

    const bus = data.busFactor;
    const body = panel(cell(grid, 'a-span-4'), 'Bus factor', 'A rough heuristic, not a verdict');
    const ring = el('div', { class: 'gs-bus__ring' });
    body.appendChild(ring);
    C.ring(ring, {
      value: bus.coverage * 100, max: 100, size: 156, label: 'Commits covered by the top authors',
      sublabel: `${plural(bus.value, 'author')}`, format: (v) => `${Math.round(v)}%`, thresholds: [],
    });
    body.appendChild(el('p', { class: 'gs-bus__names' }, bus.authors.join(', ')));
    body.appendChild(el('p', { class: 'a-muted gs-note' }, bus.note));
  }

  /* ── code ──────────────────────────────────────────────────────────────────────────────── */

  // The end of a path is the informative part, and the chart cuts labels at the end.
  const shortPaths = (files) => files.map((f) => f.path.split('/').slice(-2).join('/'));

  function renderCode() {
    const langs = data.languages;
    const hot = data.hotspots;
    const lead = langs.items.length && !langs.items[0].other
      ? `${langs.items[0].name} accounts for ${pct(langs.items[0].share)} of the changed lines.`
      : 'Changed lines per file type and per file; lockfiles, bundles and vendored code are left out.';
    const grid = section('code', 'Code', lead);

    const labels = shortPaths(hot.files);
    chartCard(cell(grid, 'a-span-7'), {
      title: 'Hottest files',
      subtitle: `Changed lines (added + deleted) · files touched at least ${hot.minCommits} times`,
      render: (body) => C.bars(body, {
        orientation: 'horizontal', valueLabel: 'Changed lines', labelHeader: 'File', valueFormat: int, title: 'Hottest files',
        emptyText: 'No file statistics in this history',
        data: hot.files.map((f, i) => ({
          id: i, label: labels[i], value: f.changes,
          sub: `${f.path} · ${plural(f.commits, 'commit')} · +${int(f.additions)} / −${int(f.deletions)} · ${f.language}`,
        })),
      }),
    });

    const side = cell(grid, 'a-span-5 gs-side');
    if (langs.items.length > 6) {
      chartCard(side, {
        title: 'Languages',
        subtitle: 'Share of changed lines, by file type',
        render: (body) => C.bars(body, {
          orientation: 'horizontal', valueLabel: 'Changed lines', labelHeader: 'Language', valueFormat: int, title: 'Languages',
          data: langs.items.map((l, i) => ({ id: i, label: l.name, value: l.changes, sub: pct(l.share, 1) })),
        }),
      });
    } else {
      const langBody = panel(side, 'Languages', 'Share of changed lines, by file type');
      if (!langs.items.length) A.empty(langBody, { title: 'No language data', text: 'No file statistics in this history.', icon: 'code' });
      else A.segbar(langBody, { tall: true, valueFormat: int, parts: langs.items.map((l) => ({ name: l.name, value: l.changes })) });
    }

    const sz = data.commitSize;
    const median = sz.buckets.findIndex((b) => b.max === null || sz.median <= b.max);
    chartCard(side, {
      title: 'Commit size',
      subtitle: `${plural(sz.commits, 'commit')} by changed lines. The median is ${int(sz.median)} (highlighted), the 90th percentile ${int(sz.p90)}.`,
      render: (body) => C.bars(body, {
        orientation: 'vertical', height: 200, valueLabel: 'Commits', labelHeader: 'Changed lines', valueFormat: int,
        title: 'Commit size distribution', highlight: median < 0 ? undefined : median,
        data: sz.buckets.map((b, i) => ({ id: i, label: b.id.replace('-', '–'), value: b.commits, sub: b.max === null ? `${int(b.min)} or more lines` : `${int(b.min)} to ${int(b.max)} lines` })),
      }),
    });
  }

  /* ── messages ──────────────────────────────────────────────────────────────────────────── */

  function renderMessages() {
    const cv = data.conventional;
    const words = data.words;
    const lead = cv.considered
      ? `${pct(cv.share)} of commit subjects follow Conventional Commits${cv.breaking ? `, ${plural(cv.breaking, 'commit')} marked as breaking` : ''}.`
      : 'There are no commit messages to read.';
    const grid = section('messages', 'Messages', lead);

    chartCard(cell(grid, 'a-span-6'), {
      title: 'Commit types',
      subtitle: `Prefix of ${plural(cv.considered, 'subject')} (merge commits left out)`,
      render: (body) => C.bars(body, {
        orientation: 'horizontal', valueLabel: 'Commits', labelHeader: 'Type', valueFormat: int, title: 'Commit types',
        emptyText: 'No commit subjects',
        data: cv.types.map((t, i) => ({ id: i, label: t.type, value: t.commits, sub: pct(t.share, 1) })),
      }),
    });
    chartCard(cell(grid, 'a-span-6'), {
      title: 'Words in commit subjects',
      subtitle: `${plural(words.unique, 'distinct word')} in ${int(words.tokens)} · stopwords and numbers left out`,
      render: (body) => C.bars(body, {
        orientation: 'horizontal', valueLabel: 'Uses', labelHeader: 'Word', valueFormat: int, title: 'Words in commit subjects',
        emptyText: 'No words to count',
        data: words.top.slice(0, 12).map((w, i) => ({ id: i, label: w.word, value: w.count })),
      }),
    });
  }

  /* ── releases ──────────────────────────────────────────────────────────────────────────── */

  function renderReleases() {
    const rel = data.releases;
    const lead = rel.count
      ? `${plural(rel.count, 'tag')}${rel.meanIntervalDays != null ? `, one every ${rel.meanIntervalDays} days on average` : ''}. The latest is ${rel.latest.name}, ${plural(rel.latest.daysAgo, 'day')} ago.`
      : 'Releases are read from git tags.';
    const grid = section('releases', 'Releases', lead);
    if (!rel.count) {
      A.empty(cell(grid, 'a-span-12 a-card gs-empty'), { title: 'No tags found', text: 'Tag a commit (for example git tag v1.0.0) and the releases will show up here.', icon: 'tag' });
      return;
    }
    const tiles = [
      { label: 'Releases', value: rel.count, format: 'int', hint: `${rel.annotated} annotated` },
      { label: 'Mean interval', value: rel.meanIntervalDays == null ? 0 : rel.meanIntervalDays, format: (v) => `${fmt.number(v, 1)} d`, hint: 'days between tags' },
      { label: 'Median interval', value: rel.medianIntervalDays == null ? 0 : rel.medianIntervalDays, format: (v) => `${fmt.number(v, 1)} d`, hint: 'less affected by outliers' },
      { label: 'Latest', value: rel.latest.daysAgo, format: (v) => `${int(v)} d ago`, hint: rel.latest.name, rich: [`${rel.latest.name} · `, nowrap(day(rel.latest.date))] },
    ];
    tiles.forEach((tile) => statTile(cell(grid, 'gs-tile'), tile));

    const shown = rel.items.filter((r) => r.daysSincePrevious != null).slice(-24);
    chartCard(cell(grid, 'a-span-8'), {
      title: 'Days between releases',
      subtitle: shown.length < rel.count - 1 ? `The latest ${shown.length} of ${int(rel.count - 1)} intervals, oldest first` : 'One bar per tag after the first, oldest first',
      render: (body) => C.bars(body, {
        orientation: 'vertical', height: 340, valueLabel: 'Days since the previous tag', labelHeader: 'Tag', valueFormat: (v) => fmt.number(v, Number.isInteger(v) ? 0 : 1),
        title: 'Days between releases',
        data: shown.map((r, i) => ({ id: i, label: r.name, value: r.daysSincePrevious, sub: `${day(r.date)}${r.annotated ? ' · annotated' : ''}` })),
      }),

    const tableCard = el('section', { class: 'a-card a-card--flush a-span-4 a-reveal', 'aria-label': 'Releases' },
      el('div', { class: 'a-card__head' }, el('div', null, el('div', { class: 'a-card__title' }, 'All tags'), el('div', { class: 'a-card__sub' }, 'Newest first'))));
    grid.appendChild(tableCard);
    A.table(tableCard, {
      dense: true, pageSize: 8, search: { placeholder: 'Search tags…', keys: ['name'] }, sort: { key: 'date', dir: 'desc' },
      columns: [
        { key: 'name', label: 'Tag', mono: true },
        { key: 'date', label: 'Date', format: (v) => day(v) },
        { key: 'daysSincePrevious', label: 'Gap', align: 'right', format: (v) => (v == null ? '–' : `${fmt.number(v, Number.isInteger(v) ? 0 : 1)} d`) },

  /* ── README card ───────────────────────────────────────────────────────────────────────── */

  const SNIPPET = '![gitstory card](card.svg)';

    how.appendChild(el('p', { class: 'a-muted gs-note' }, '2. Reference it from Markdown'));

  /* ── command palette ───────────────────────────────────────────────────────────────────── */

  function setupCommands(refresh) {
    const go = ([id, label]) => ({ id: `go-${id}`, label: `Go to ${label}`, group: 'Navigate', hint: 'section', run: () => goTo(id) });
    const commands = sections.map(go);
    commands.push({ id: 'theme', label: 'Toggle light / dark theme', group: 'Actions', keywords: 'appearance mode', run: () => A.theme.toggle() });
    commands.push({ id: 'json', label: 'Download the metrics as JSON', group: 'Actions', keywords: 'export save data', run: downloadJson });
    if (hasCommits) {
      commands.push({ id: 'charts', label: 'Show the charts', group: 'Actions', keywords: 'view graphs', run: () => { shell.views.select('charts'); } });
      commands.push({ id: 'tables', label: 'Show the data as tables', group: 'Actions', keywords: 'view rows numbers', run: () => { shell.views.select('tables'); } });
      commands.push({ id: 'snippet', label: 'Copy the README snippet for the card', group: 'Actions', keywords: 'markdown badge image', run: () => A.copy(SNIPPET, { label: 'Snippet copied' }) });
    }
    if (refresh) commands.push({ id: 'refresh', label: 'Refresh the data from the repository', group: 'Actions', keywords: 'reload update', run: refresh });
    A.cmdk.register(commands);
  }

  /* ── the rail, the breadcrumbs and the view follow the scroll ──────────────────────────── */

  // Opens a section: the address changes (so the browser scrolls there), or the page just scrolls when it already points there.
  function goTo(id) {
    const target = document.getElementById(id);
    if (!target) return;
    if (window.location.hash === `#${id}`) target.scrollIntoView();
    else window.location.hash = `#${id}`;
  }

  function trackSections() {
    const targets = sections.map(([id]) => document.getElementById(id));
    let current = sections[0][0];
    let pinned = false; // a destination that was just chosen wins until the page has finished scrolling to it
    let release = 0;

    function show(index) {
      const [id, label] = sections[index];
      if (id === current) return;
      current = id;
      shell.setActive(id);
      shell.setCrumbs(crumbs(label));
    }
    function settle() {
      window.clearTimeout(release);
      release = window.setTimeout(() => { pinned = false; }, 160);
    }
    function pin(id) {
      const index = sections.findIndex((entry) => entry[0] === id);
      if (index < 0) return;
      pinned = true;
      show(index);
      settle();
    }
    const follow = A.throttle(() => {
      if (pinned) { settle(); return; } // still scrolling towards the chosen section
      let index = 0;
      targets.forEach((target, i) => { if (target && target.getBoundingClientRect().top < window.innerHeight * 0.4) index = i; });
      const atEnd = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4;
      show(atEnd ? targets.length - 1 : index);
    }, 80);

    window.addEventListener('scroll', follow, { passive: true });
    window.addEventListener('resize', follow);
    window.addEventListener('hashchange', () => pin(window.location.hash.slice(1)));
    document.addEventListener('click', (event) => {
      const link = event.target.closest ? event.target.closest('a[href^="#"]') : null;
      if (link) pin(link.getAttribute('href').slice(1));
    });
    follow();
  }

  /* ── go ────────────────────────────────────────────────────────────────────────────────── */

  const hasStory = renderStory();
  if (hasStory) {
    renderFacts();
    renderActivity();
    renderPeople();
    renderCode();
    renderMessages();
    renderReleases();
    renderCard();
    trackSections();
  }
  setupCommands(liveControls.refresh);
  A.reveal(app);

  // The page was opened on a section (#people): the sections did not exist yet when the browser looked.
  const opened = sections.find(([id]) => `#${id}` === window.location.hash);
  if (opened) document.getElementById(opened[0]).scrollIntoView({ behavior: 'instant' });
})();
</script>
</body>
</html>
